name: Build static site into main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'index.html'

permissions:
  contents: write

jobs:
  build-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Replace root with built static site
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          touch .nojekyll

      - name: Commit built site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          git diff --cached --quiet || git commit -m "Publish static EATit build [skip ci]"
          git push
